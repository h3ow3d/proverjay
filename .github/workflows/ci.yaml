name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

jobs:
  test:
    name: Test Go app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  release:
    name: Publish signed image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            CREATED=${{ steps.image.outputs.created }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image
        run: |
          cosign sign --yes "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"

  provenance:
    name: Generate SLSA provenance
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.release.outputs.image }}
      digest: ${{ needs.release.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  publish-cosign-slsa-attestation:
    name: Publish Cosign-readable SLSA attestation
    runs-on: ubuntu-latest
    needs: [release, provenance]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read

    env:
      EXPECTED_SLSA_BUILDER: https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0
      EXPECTED_SLSA_BUILD_TYPE: https://github.com/slsa-framework/slsa-github-generator/container@v1
      EXPECTED_WORKFLOW_ENTRYPOINT: .github/workflows/ci.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Install slsa-verifier
        uses: slsa-framework/slsa-verifier/actions/installer@v2.7.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SLSA provenance and publish Cosign attestation
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          SOURCE_URI: github.com/${{ github.repository }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          IMAGE_BY_DIGEST="${IMAGE}@${DIGEST}"

          echo "Verifying original SLSA generator provenance:"
          echo "  image:      ${IMAGE_BY_DIGEST}"
          echo "  source-uri: ${SOURCE_URI}"
          echo "  source-tag: ${SOURCE_TAG}"

          slsa-verifier verify-image \
            "${IMAGE_BY_DIGEST}" \
            --source-uri "${SOURCE_URI}" \
            --source-tag "${SOURCE_TAG}" \
            --print-provenance \
            > slsa-statement.json

          echo "Extracting SLSA predicate for Cosign attestation..."
          jq '.predicate' slsa-statement.json > slsa-predicate.json

          echo "Checking SLSA statement shape..."
          jq -e '
            ._type == "https://in-toto.io/Statement/v0.1"
            and .predicateType == "https://slsa.dev/provenance/v0.2"
            and (.subject | length) == 1
            and .subject[0].name == env.IMAGE
            and .subject[0].digest.sha256 == (env.DIGEST | sub("^sha256:"; ""))
          ' slsa-statement.json

          echo "Checking trusted SLSA builder and workflow entrypoint..."
          jq -e '
            .builder.id == env.EXPECTED_SLSA_BUILDER
            and .buildType == env.EXPECTED_SLSA_BUILD_TYPE
            and .invocation.configSource.entryPoint == env.EXPECTED_WORKFLOW_ENTRYPOINT
            and .invocation.configSource.uri == ("git+https://" + env.SOURCE_URI + "@refs/tags/" + env.SOURCE_TAG)
            and .invocation.configSource.digest.sha1 == env.GITHUB_SHA
          ' slsa-predicate.json

          echo "Publishing Cosign-readable SLSA attestation..."
          cosign attest \
            --yes \
            --predicate slsa-predicate.json \
            --type slsaprovenance \
            "${IMAGE_BY_DIGEST}"

          echo "Verifying newly published Cosign SLSA attestation..."
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yaml@refs/tags/${SOURCE_TAG}" \
            "${IMAGE_BY_DIGEST}" \
            > cosign-slsa-attestation.jsonl

          echo "Cosign-readable SLSA attestation published and verified."
