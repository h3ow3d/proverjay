name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  actions: read

jobs:
  test:
    name: Test Go app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  release:
    name: Publish signed image
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_ref }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            CREATED=${{ steps.image.outputs.created }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Restore cosign private key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        run: |
          test -n "${COSIGN_PRIVATE_KEY}"
          umask 077
          printf '%s' "${COSIGN_PRIVATE_KEY}" > "${RUNNER_TEMP}/cosign.key"

      - name: Sign image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --yes --key "${RUNNER_TEMP}/cosign.key" "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Generate provenance predicate
        run: |
          cat > "${RUNNER_TEMP}/provenance.json" <<EOF
          {
            "buildType": "https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@refs/tags/${{ github.ref_name }}",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@refs/tags/${{ github.ref_name }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}.git",
                "digest": {
                  "sha1": "${{ github.sha }}"
                },
                "entryPoint": ".github/workflows/ci.yaml"
              },
              "parameters": {
                "image": "${{ steps.image.outputs.image }}",
                "digest": "${{ steps.build.outputs.digest }}"
              },
              "environment": {
                "githubWorkflow": "${{ github.workflow }}",
                "githubRunId": "${{ github.run_id }}",
                "githubRunAttempt": "${{ github.run_attempt }}",
                "githubRef": "${{ github.ref }}"
              }
            },
            "metadata": {
              "buildInvocationId": "${{ github.run_id }}",
              "completeness": {
                "parameters": true,
                "environment": false,
                "materials": false
              },
              "reproducible": false
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}.git",
                "digest": {
                  "sha1": "${{ github.sha }}"
                }
              }
            ]
          }
          EOF

      - name: Attest image provenance
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest --yes --key "${RUNNER_TEMP}/cosign.key" --predicate "${RUNNER_TEMP}/provenance.json" --type slsaprovenance "${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}"
