name: CI

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    name: Test Go app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Run tests
        run: make test

  docker-build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image metadata
        id: image
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            -t "${{ steps.image.outputs.image_ref }}" .

      - name: Push image
        id: push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          docker push "${{ steps.image.outputs.image_ref }}" | tee push.log

          DIGEST="$(grep -Eo 'digest: sha256:[a-f0-9]+' push.log | awk '{print $2}' | tail -n 1)"

          if [ -z "$DIGEST" ]; then
            echo "Failed to extract image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: $DIGEST"

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          cosign sign --yes "$IMAGE_REF"

  trivy-scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write

    env:
      IMAGE_REF: ${{ needs.docker-build.outputs.image }}@${{ needs.docker-build.outputs.digest }}

    steps:
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Scan image (gate – fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan image (SARIF – upload to Security tab)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Scan image (cosign-vuln – attestation payload)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cosign-vuln
          output: trivy-vuln-attestation.json
          ignore-unfixed: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Attest vulnerability scan results
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}
        run: |
          cosign attest --yes \
            --predicate trivy-vuln-attestation.json \
            --type vuln \
            "$IMAGE_REF"

  provenance:
    name: Generate SLSA provenance
    needs: [docker-build, trivy-scan]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      id-token: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.docker-build.outputs.image }}
      digest: ${{ needs.docker-build.outputs.digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
