apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-proverjay-harbor-image
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: harbor.proverjay.test/proverjay/proverjay*
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/h3ow3d/proverjay/\\.github/workflows/ci\\.ya?ml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
    - name: slsaGenerator
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: "^https://github\\.com/slsa-framework/slsa-github-generator/\\.github/workflows/generator_container_slsa3\\.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+$"
  attestations:
    - name: slsaProvenance
      intoto:
        type: "https://slsa.dev/provenance/v0.2"
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('harbor.proverjay.test/proverjay/proverjay'))
        .map(image, verifyImageSignatures(image, [attestors.release]))
        .all(result, result > 0)
      message: Harbor proverjay images must be signed by the trusted release workflow.
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers)
        .filter(image, image.startsWith('harbor.proverjay.test/proverjay/proverjay'))
        .map(image, verifyAttestationSignatures(image, attestations.slsaProvenance, [attestors.slsaGenerator]))
        .all(result, result > 0)
      message: Harbor proverjay images must include a signed SLSA provenance attestation.
