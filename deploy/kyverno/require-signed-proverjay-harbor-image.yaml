apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-proverjay-harbor-image
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchImageReferences:
    - glob: harbor.proverjay.test/proverjay/proverjay*

  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true

  credentials:
    allowInsecureRegistry: true
    secrets:
      - harbor-pull-secret

  attestors:
    - name: githubActionsKeyless
      cosign:
        keyless:
          identities:
            - subjectRegExp: "https://github\\.com/h3ow3d/proverjay/\\.github/workflows/ci\\.yaml@refs/tags/v.*"
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev

  validations:
    - expression: >-
        images.containers
          .filter(image, image.startsWith('harbor.proverjay.test/proverjay/proverjay'))
          .map(image, verifyImageSignatures(image, [attestors.githubActionsKeyless]))
          .all(result, result > 0)
      message: Harbor proverjay images must have a valid keyless Cosign signature from the trusted GitHub Actions workflow.
