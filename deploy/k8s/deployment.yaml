apiVersion: apps/v1
kind: Deployment
metadata:
  name: proverjay
  namespace: proverjay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proverjay
  template:
    metadata:
      labels:
        app: proverjay
    spec:
      containers:
        - name: proverjay
          image: ghcr.io/h3ow3d/proverjay:c8e02265a774bc115d8e5fb579d9adb469819f95 # v0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
