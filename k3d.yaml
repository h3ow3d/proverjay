apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: proverjay

servers: 1
agents: 1

kubeAPI:
  hostPort: "6550"

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

registries:
  create:
    name: proverjay-registry
    host: "0.0.0.0"
    hostPort: "5000"

options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
